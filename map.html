<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorite Places — Brian Jason Martin</title>
  <meta name="description" content="Brian Jason Martin's favorite places — restaurants, bars, coffee, hotels, and experiences worth knowing about." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://bjmartin.com/map" />
  <meta property="og:title"       content="Favorite Places — Brian Jason Martin" />
  <meta property="og:description" content="BJ's curated map of restaurants, bars, coffee shops, hotels, and experiences worth knowing about." />
  <meta property="og:image"       content="https://bjmartin.com/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="map.css" />
</head>
<body class="map-body">

  <!-- ── NAV ─────────────────────────────────────────────── -->
  <nav id="nav">
    <a href="/" class="nav-logo">BJM</a>
    <button class="nav-toggle" aria-label="Toggle menu" id="navToggle">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/#about">About</a></li>
      <li><a href="/#story">Story</a></li>
      <li><a href="/#craft">Craft</a></li>
      <li><a href="/#life">Life</a></li>
      <li><a href="/#art">Art</a></li>
      <li><a href="/#contact">Contact</a></li>
      <li><a href="/map" class="nav-map-active">Map</a></li>
    </ul>
  </nav>

  <!-- ── MAP WRAPPER ─────────────────────────────────────── -->
  <div id="map-wrapper">

    <!-- Leaflet map -->
    <div id="map"></div>

    <!-- ── CONTROLS OVERLAY ──────────────────────────────── -->
    <div id="map-controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="search" id="map-search" placeholder="Search places or cities…" autocomplete="off" />
      </div>
      <div class="filter-pills" id="filterPills">
        <button class="filter-pill active" data-cat="all">All</button>
        <button class="filter-pill" data-cat="Restaurant">🍽 Restaurant</button>
        <button class="filter-pill" data-cat="Bar">🍸 Bar</button>
        <button class="filter-pill" data-cat="Coffee">☕ Coffee</button>
        <button class="filter-pill" data-cat="Hotel">🏨 Hotel</button>
        <button class="filter-pill" data-cat="Experience">⭐ Experience</button>
        <button class="filter-pill" data-cat="Other">📍 Other</button>
      </div>
    </div>

    <!-- ── SIDEBAR ────────────────────────────────────────── -->
    <div id="sidebar">
      <button id="sidebar-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div id="sidebar-content">

        <div id="sidebar-gallery-wrap" class="hidden">
          <div id="sidebar-gallery"></div>
        </div>

        <div class="sidebar-meta">
          <span id="place-category-badge" class="category-badge"></span>
          <span id="place-location" class="place-location"></span>
        </div>

        <h2 id="place-name"></h2>

        <p id="place-description" class="place-description"></p>

        <div id="place-memory-wrap" class="place-memory-wrap hidden">
          <div class="memory-rule"></div>
          <p id="place-memory-text" class="place-memory-text"></p>
        </div>

        <a id="place-website" class="place-website hidden" target="_blank" rel="noopener">
          Visit website →
        </a>

        <div id="admin-place-actions" class="admin-place-actions hidden">
          <button id="btn-edit-place" class="btn-admin-edit">Edit</button>
          <button id="btn-delete-place" class="btn-admin-delete">Delete</button>
        </div>

      </div>
    </div>

    <!-- ── ADMIN INDICATOR ────────────────────────────────── -->
    <div id="admin-indicator" class="admin-indicator hidden">
      <span class="admin-dot"></span> Admin Mode
    </div>

    <!-- ── LOCK BUTTON ────────────────────────────────────── -->
    <button id="lock-btn" class="lock-btn" aria-label="Admin login">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- ── ADD PLACE FAB ──────────────────────────────────── -->
    <button id="add-place-btn" class="add-place-btn hidden" aria-label="Add place">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add Place
    </button>

    <!-- ── ADD / EDIT MODAL ───────────────────────────────── -->
    <div id="add-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Add place">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <h3 id="modal-title">Add Place</h3>
          <button id="modal-close" class="modal-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <form id="add-place-form" class="modal-form" novalidate>
          <input type="hidden" id="form-id" name="id" />
          <input type="hidden" id="form-lat" name="lat" />
          <input type="hidden" id="form-lng" name="lng" />

          <div class="form-group">
            <label for="form-name">Name <span class="req">*</span></label>
            <input type="text" id="form-name" name="name" required placeholder="e.g. Carbone" autocomplete="off" />
          </div>

          <div class="form-row two-col">
            <div class="form-group">
              <label for="form-category">Category</label>
              <select id="form-category" name="category">
                <option value="Restaurant">🍽 Restaurant</option>
                <option value="Bar">🍸 Bar</option>
                <option value="Coffee">☕ Coffee</option>
                <option value="Hotel">🏨 Hotel</option>
                <option value="Experience">⭐ Experience</option>
                <option value="Other">📍 Other</option>
              </select>
            </div>
          </div>

          <div class="form-row two-col">
            <div class="form-group">
              <label for="form-city">City</label>
              <input type="text" id="form-city" name="city" placeholder="New York" />
            </div>
            <div class="form-group">
              <label for="form-state">State</label>
              <input type="text" id="form-state" name="state" placeholder="NY" />
            </div>
          </div>

          <div class="form-group">
            <label for="form-description">Description</label>
            <textarea id="form-description" name="description" rows="3" placeholder="What makes this place worth knowing about?"></textarea>
          </div>

          <div class="form-group">
            <label for="form-memory">Your Memory <span class="form-hint">shown as a personal note</span></label>
            <textarea id="form-memory" name="memory" rows="3" placeholder="A personal note about this place…"></textarea>
          </div>

          <div class="form-group">
            <label for="form-website">Website</label>
            <input type="url" id="form-website" name="website" placeholder="https://" />
          </div>

          <div class="form-group">
            <label for="form-images">Photos</label>
            <div class="file-input-wrap">
              <input type="file" id="form-images" name="images" multiple accept="image/*" />
              <span class="file-input-label">Choose photos…</span>
            </div>
            <div id="image-preview-wrap" class="image-preview-wrap hidden">
              <div id="image-preview" class="image-preview"></div>
            </div>
          </div>

          <div id="form-coords-display" class="form-coords"></div>

          <div id="form-error" class="form-error hidden"></div>

          <button type="submit" id="form-submit" class="btn-form-submit">Save Place</button>
        </form>
      </div>
    </div>

    <!-- ── PASSWORD MODAL ────────────────────────────────── -->
    <div id="pw-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div id="pw-modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel modal-panel-sm">
        <div class="modal-header">
          <h3>Admin Login</h3>
          <button id="pw-modal-close" class="modal-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <form id="pw-form" class="modal-form">
          <div class="form-group">
            <label for="pw-input">Password</label>
            <input type="password" id="pw-input" autocomplete="current-password" placeholder="Enter admin password" />
          </div>
          <div id="pw-error" class="form-error hidden">Incorrect password.</div>
          <button type="submit" class="btn-form-submit">Unlock</button>
        </form>
      </div>
    </div>

    <!-- ── DELETE CONFIRM MODAL ───────────────────────────── -->
    <div id="del-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" id="del-modal-backdrop"></div>
      <div class="modal-panel modal-panel-sm">
        <div class="modal-header">
          <h3>Delete Place</h3>
        </div>
        <p class="del-confirm-text">Are you sure you want to delete <strong id="del-place-name"></strong>? This cannot be undone.</p>
        <div class="del-actions">
          <button id="del-cancel" class="btn-admin-edit">Cancel</button>
          <button id="del-confirm" class="btn-admin-delete">Delete</button>
        </div>
      </div>
    </div>

    <!-- ── LIGHTBOX ───────────────────────────────────────── -->
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
      <button id="lb-close" class="lb-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="lb-prev" class="lb-nav lb-prev" aria-label="Previous">‹</button>
      <div class="lb-img-wrap">
        <img id="lb-img" src="" alt="" />
      </div>
      <button id="lb-next" class="lb-nav lb-next" aria-label="Next">›</button>
      <div id="lb-counter" class="lb-counter"></div>
    </div>

    <!-- ── TOAST ──────────────────────────────────────────── -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  </div><!-- /map-wrapper -->

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
